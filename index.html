            <style>
      .pizza-preset-btn {
        font: inherit;
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--border-color, #ccc);
        background: transparent;
        color: inherit;
        cursor: pointer;
        border-radius: 3px;
      }
      .pizza-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .metric-search-input {
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 0.5rem;
        padding: 4px 6px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.3;
        border: 1px solid var(--border-color, #ccc);
        background: transparent;
        color: inherit;
        border-radius: 3px;
      }

      .metric-row {
        width: 546px;
        max-width: 100%;
        margin: 0 auto;
      }
      .metric-row-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
        width: 100%;
      }
      .metric-row-label {
        flex: 1;
        min-width: 0;
      }
      .metric-row-actions {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        opacity: 0.35;
        transition: opacity 0.15s ease;
        flex-shrink: 0;
      }
      .metric-row:hover .metric-row-actions {
        opacity: 0.85;
      }
      .metric-move-btn,
      .metric-hide-btn {
        font: inherit;
        font-size: 0.7rem;
        line-height: 1;
        padding: 0 0.15rem;
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        opacity: 0.8;
      }
      .metric-move-btn:hover,
      .metric-hide-btn:hover {
        opacity: 1;
      }
</style>
</head>
